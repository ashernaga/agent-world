<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent window</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e6e8ee;--mute:#8b93a7;--you:#2d5bff;--gpt:#10a37f;--claude:#d97757;--ctl:#6b7488;--add:#12351f;--del:#3d1a1a;--ok:#3ecf8e;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:grid;grid-template-columns:240px 1fr 420px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Segoe UI,sans-serif}
  aside,section{min-height:0;display:flex;flex-direction:column}
  #hist{background:var(--panel);border-right:1px solid var(--line)}
  #side{background:var(--panel);border-left:1px solid var(--line)}
  h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
  .scroll{overflow:auto;flex:1;padding:12px}
  .h{padding:8px 10px;border-radius:8px;margin-bottom:6px;background:#1d212b;cursor:default}
  .h b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .h small{color:var(--mute)}
  .tag{font-size:11px;padding:1px 6px;border-radius:99px;background:#2a2f3b;margin-left:4px}
  .tag.applied{background:#12351f;color:var(--ok)} .tag.rejected{background:#3d2a12;color:#ffb454}
  #chat{padding:18px 22px}
  .m{max-width:820px;margin:0 0 14px;display:flex;gap:10px}
  .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
  .av.You{background:var(--you)}.av.GPT{background:var(--gpt)}.av.Claude{background:var(--claude)}.av.Controller{background:var(--ctl)}
  .bub{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;min-width:0}
  .bub small{display:block;color:var(--mute);margin-bottom:2px}
  .m.error .bub{border-color:var(--bad)} .m.step .bub{background:transparent;border-style:dashed;color:var(--mute)}
  .m.checks .bub,.m.result .bub{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  form{display:flex;gap:8px;padding:12px 22px;border-top:1px solid var(--line);background:var(--panel)}
  textarea{flex:1;resize:none;height:56px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
  button{border:0;border-radius:10px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--you)}
  button:disabled{opacity:.4;cursor:not-allowed}
  #steps{padding:12px 16px;border-bottom:1px solid var(--line)}
  .s{display:flex;align-items:center;gap:10px;padding:3px 0;color:var(--mute)}
  .dot{width:10px;height:10px;border-radius:50%;background:#2a2f3b}
  .s.done{color:var(--text)}.s.done .dot{background:var(--ok)}
  .s.now{color:var(--text)}.s.now .dot{background:var(--claude);animation:p 1s infinite}
  @keyframes p{50%{opacity:.3}}
  #diffwrap{flex:1;display:flex;flex-direction:column;min-height:0}
  #files{padding:10px 16px;color:var(--mute);font-size:12px}
  #diff{flex:1;overflow:auto;margin:0;padding:8px 0;font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--bg)}
  #diff div{padding:0 14px;white-space:pre-wrap;word-break:break-all}
  .a{background:var(--add)}.d{background:var(--del)}.hh{color:#7aa2ff}
  #act{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
  #act button{flex:1;height:42px}
  #ok{background:#1f9d62}#no{background:#8a2f2f}
  .empty{color:var(--mute);padding:20px;text-align:center}
</style>
</head>
<body>
<aside id="hist"><h2>History</h2><div class="scroll" id="histlist"></div></aside>

<section>
  <h2>__PROJECT__ — agents</h2>
  <div class="scroll" id="chat"><div class="empty" id="hint">Describe a change you want. GPT plans, Claude proposes a diff, you approve it.</div></div>
  <form id="f">
    <textarea id="t" placeholder="What change would you like to propose?  (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="send">Send</button>
  </form>
</section>

<aside id="side">
  <h2>Progress</h2>
  <div id="steps"></div>
  <div id="diffwrap">
    <h2>Proposed diff</h2>
    <div id="files">Nothing waiting for approval.</div>
    <pre id="diff"></pre>
    <div id="act" hidden>
      <button id="no">Reject</button>
      <button id="ok">Approve &amp; apply</button>
    </div>
  </div>
</aside>

<script>
const TOKEN="__TOKEN__";
const H={"X-Token":TOKEN,"Content-Type":"application/json"};
const $=id=>document.getElementById(id);
let next=0,status="idle",lastDiff=null;

async function api(path,opt){
  const r=await fetch(path,Object.assign({headers:H},opt||{}));
  return r.json();
}
function addMsg(e){
  $("hint")?.remove();
  const m=document.createElement("div");m.className="m "+e.kind;
  const av=document.createElement("div");av.className="av "+e.agent;av.textContent=e.agent[0];
  const b=document.createElement("div");b.className="bub";
  const s=document.createElement("small");s.textContent=e.agent+" · "+e.ts;
  b.append(s,document.createTextNode(e.text));
  m.append(av,b);$("chat").append(m);
  $("chat").scrollTop=$("chat").scrollHeight;
}
function renderSteps(names,step){
  const box=$("steps");box.textContent="";
  names.forEach((n,i)=>{
    const d=document.createElement("div");
    d.className="s"+(status=="idle"?"":(i+1<step?" done":(i+1==step?" now":"")));
    const dot=document.createElement("span");dot.className="dot";
    d.append(dot,document.createTextNode((i+1)+". "+n));box.append(d);
  });
}
function renderDiff(p){
  const key=p?p.diff:null; if(key===lastDiff)return; lastDiff=key;
  const pre=$("diff");pre.textContent="";
  if(!p){$("files").textContent="Nothing waiting for approval.";return;}
  $("files").textContent=p.summary+"  —  "+p.files.join(", ");
  p.diff.split("\n").forEach(l=>{
    const d=document.createElement("div");
    d.className=l.startsWith("+")&&!l.startsWith("+++")?"a":l.startsWith("-")&&!l.startsWith("---")?"d":l.startsWith("@@")?"hh":"";
    d.textContent=l||" ";pre.append(d);
  });
}
async function loadHistory(){
  const h=await api("/api/history");const box=$("histlist");box.textContent="";
  if(!h.length){const e=document.createElement("div");e.className="empty";e.textContent="No tasks yet.";box.append(e);return;}
  h.forEach(r=>{
    const d=document.createElement("div");d.className="h";
    const b=document.createElement("b");b.textContent=r.task;b.title=r.task;
    const s=document.createElement("small");s.textContent=r.time+" ";
    const t=document.createElement("span");t.className="tag "+r.outcome.split(" ")[0];t.textContent=r.outcome;
    s.append(t);d.append(b,s);
    if(r.undo){d.title="Undo: "+r.undo;}
    box.append(d);
  });
}
async function poll(){
  try{
    const s=await api("/api/state?since="+next);
    const was=status;status=s.status;next=s.next;
    s.events.forEach(addMsg);
    renderSteps(s.steps,s.step);renderDiff(s.pending);
    $("act").hidden=status!=="awaiting_approval";
    $("send").disabled=status!=="idle";
    if(was!=="idle"&&status==="idle")loadHistory();
  }catch(e){}
  setTimeout(poll,1000);
}
$("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const task=$("t").value.trim();if(!task||status!=="idle")return;
  $("t").value="";await api("/api/task",{method:"POST",body:JSON.stringify({task})});
});
$("t").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("f").requestSubmit();}});
$("ok").onclick=()=>{ if(confirm("Apply this exact diff to your working tree? It will not be committed."))api("/api/approve",{method:"POST",body:"{}"}); };
$("no").onclick=()=>api("/api/reject",{method:"POST",body:"{}"});
loadHistory();poll();
</script>
</body>
</html>
